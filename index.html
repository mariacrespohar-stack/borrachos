<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4c94f">
<title>borrachos.com</title>

<style>
:root{
  --yellow:#f5c84b;
  --yellow-dark:#d9a91e;
  --cream:#fff8df;
  --pastel:#fff0ae;
  --pastel2:#ffe69a;
  --text:#594714;
  --white:#fffdf5;
  --danger:#e66b55;
  --shadow:0 8px 22px rgba(108,79,7,.12);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  background:var(--yellow);
  color:var(--text);
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  min-height:100vh;
  padding:20px 16px 35px;
}

.screen{
  max-width:620px;
  margin:auto;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:8px 0 22px;
}

h1{
  font-size:30px;
  margin:0;
  font-weight:850;
  letter-spacing:-1px;
}

h2{
  font-size:23px;
  margin:0 0 14px;
}

h3{
  margin:0 0 8px;
}

.sub{
  opacity:.7;
  margin-top:5px;
}

.card{
  background:var(--cream);
  border-radius:25px;
  padding:18px;
  box-shadow:var(--shadow);
  margin-bottom:14px;
}

.party{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--pastel);
  padding:17px;
  border-radius:20px;
  margin:10px 0;
  transition:.15s;
}

.party:active{
  transform:scale(.98);
}

.party-info strong{
  display:block;
  font-size:19px;
}

.party-info small{
  opacity:.65;
}

.iconbtn,
.back{
  width:45px;
  height:45px;
  border-radius:16px;
  background:var(--cream);
  color:var(--text);
  font-size:25px;
  box-shadow:var(--shadow);
}

.add{
  background:var(--text);
  color:white;
  width:55px;
  height:55px;
  border-radius:19px;
  font-size:30px;
}

.primary{
  background:var(--text);
  color:#fff;
  padding:14px 18px;
  border-radius:17px;
  font-weight:750;
  width:100%;
  margin-top:8px;
}

.secondary{
  background:var(--pastel2);
  color:var(--text);
  padding:11px 14px;
  border-radius:14px;
  font-weight:700;
}

.danger{
  background:#ffd5c9;
  color:#9c3f2e;
  padding:10px 13px;
  border-radius:13px;
  font-weight:700;
}

input{
  width:100%;
  border:0;
  outline:0;
  background:var(--pastel);
  padding:15px;
  border-radius:15px;
  color:var(--text);
  margin:7px 0;
}

.empty{
  text-align:center;
  padding:40px 20px;
  opacity:.7;
}

.people{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.person{
  background:var(--pastel);
  padding:10px 13px;
  border-radius:15px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:8px;
}

.person button{
  background:transparent;
  color:#9c3f2e;
  font-size:17px;
}

.tabs{
  display:flex;
  background:var(--pastel);
  padding:5px;
  border-radius:17px;
  margin:15px 0;
}

.tab{
  flex:1;
  padding:12px;
  border-radius:13px;
  background:transparent;
  color:var(--text);
  font-weight:800;
}

.tab.active{
  background:var(--cream);
  box-shadow:0 3px 10px rgba(108,79,7,.1);
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.option{
  background:var(--pastel);
  border-radius:17px;
  padding:15px 12px;
  text-align:left;
  min-height:72px;
  color:var(--text);
  font-weight:800;
}

.option small{
  display:block;
  font-weight:500;
  opacity:.6;
  margin-top:4px;
}

.person-row{
  background:var(--cream);
  padding:14px;
  border-radius:18px;
  margin:9px 0;
}

.person-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.person-head strong{
  font-size:18px;
}

.counts{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.pill{
  background:var(--pastel);
  padding:8px 10px;
  border-radius:12px;
  font-size:13px;
}

.history{
  margin-top:12px;
}

.log{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#fff7d3;
  padding:10px 12px;
  border-radius:13px;
  margin-top:6px;
  font-size:13px;
  gap:10px;
}

.log button{
  background:#ffd5c9;
  color:#9c3f2e;
  border-radius:10px;
  padding:6px 8px;
}

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(66,49,5,.35);
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:12px;
  z-index:20;
}

.modal{
  width:min(620px,100%);
  background:var(--cream);
  border-radius:27px;
  padding:20px;
  max-height:90vh;
  overflow:auto;
}

.modal-bg.show{
  display:flex;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.chartbar{
  margin:13px 0;
}

.chartlabel{
  display:flex;
  justify-content:space-between;
  font-weight:750;
  font-size:14px;
}

.barbg{
  height:20px;
  background:var(--pastel);
  border-radius:10px;
  overflow:hidden;
  margin-top:6px;
}

.bar{
  height:100%;
  background:var(--yellow-dark);
  border-radius:10px;
  min-width:3px;
}

.rank{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--pastel);
  padding:13px;
  border-radius:16px;
  margin:8px 0;
}

.ranknum{
  font-size:20px;
  font-weight:900;
  width:30px;
}

.total{
  margin-left:auto;
  font-weight:900;
}

.notice{
  font-size:12px;
  opacity:.65;
  text-align:center;
  margin-top:15px;
}

.firebase-status{
  text-align:center;
  font-size:11px;
  opacity:.55;
  margin-top:8px;
}

@media(max-width:390px){
  .options{
    grid-template-columns:1fr;
  }

  .app{
    padding-left:12px;
    padding-right:12px;
  }
}
</style>
</head>

<body>

<div class="app">
  <div id="root" class="screen"></div>
</div>

<div id="modalBg" class="modal-bg">
  <div class="modal" id="modal"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyB1JbrYbUXyR17Mwhm-ISBwrqkB20lec4Y",
  authDomain: "borrachos-8a8d1.firebaseapp.com",
  databaseURL: "https://borrachos-8a8d1-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "borrachos-8a8d1",
  storageBucket: "borrachos-8a8d1.firebasestorage.app",
  messagingSenderId: "586341945009",
  appId: "1:586341945009:web:cea538e985403fe7525c90"
};

const defaultDrink = {
  cups:["Calimocho","Vodka naranja","Ron cola","Glivery"],
  shots:["Plata o plomo","Tequila","Tequifresi"]
};

let state = {
  parties:[],
  drinkOptions:{
    cups:[...defaultDrink.cups],
    shots:[...defaultDrink.shots]
  }
};

let current = null;
let tab = "cups";

let db = null;
let partidaRef = null;
let firebaseReady = false;


/* =========================
   ID
========================= */

function makeId(){

  if(
    window.crypto &&
    typeof window.crypto.randomUUID === "function"
  ){
    return window.crypto.randomUUID();
  }

  return "id-" +
    Date.now().toString(36) +
    "-" +
    Math.random().toString(36).slice(2) +
    "-" +
    Math.random().toString(36).slice(2);
}


/* =========================
   FIREBASE
========================= */

function startFirebase(){

  try{

    if(!window.firebase){
      console.warn("Firebase no está cargado.");
      return;
    }

    if(!firebase.apps.length){
      firebase.initializeApp(firebaseConfig);
    }

    db=firebase.database();
    partidaRef=db.ref("partida");

    firebaseReady=true;

    partidaRef.on(
      "value",
      snapshot=>{

        const data=snapshot.val();

        if(data){

          state=data;

          if(!Array.isArray(state.parties)){
            state.parties=[];
          }

          if(!state.drinkOptions){
            state.drinkOptions={
              cups:[...defaultDrink.cups],
              shots:[...defaultDrink.shots]
            };
          }

          if(!Array.isArray(state.drinkOptions.cups)){
            state.drinkOptions.cups=[];
          }

          if(!Array.isArray(state.drinkOptions.shots)){
            state.drinkOptions.shots=[];
          }

          if(current){

            current=
              state.parties.find(
                p=>p.id===current.id
              ) || null;

          }

        }

        render();

      },
      error=>{

        console.warn(
          "Firebase no disponible:",
          error
        );

        firebaseReady=false;

        render();

      }
    );

  }catch(error){

    console.warn(
      "Error iniciando Firebase:",
      error
    );

    firebaseReady=false;

    render();

  }

}


/* =========================
   GUARDAR
========================= */

function save(){

  if(!firebaseReady || !partidaRef){
    return;
  }

  partidaRef
    .set(state)
    .catch(error=>{

      console.warn(
        "No se pudo guardar:",
        error
      );

    });

}


/* =========================
   ESCAPAR TEXTO
========================= */

function esc(s){

  return String(s).replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}


/* =========================
   NAVEGACIÓN
========================= */

function goHome(){

  current=null;
  render();

}

function party(id){

  current=
    state.parties.find(
      p=>p.id===id
    ) || null;

  tab="cups";

  render();

}

function render(){

  const r=
    document.getElementById("root");

  if(!current){
    renderHome(r);
  }else{
    renderParty(r);
  }

}


/* =========================
   PANTALLA PRINCIPAL
========================= */

function renderHome(r){

  r.innerHTML=`

    <div class="header">

      <div>

        <h1>🍻 borrachos.com</h1>

        <div class="sub">
          Tus fiestas, tus cuentas.
        </div>

      </div>

      <button
        class="add"
        type="button"
        onclick="newParty()">

        +

      </button>

    </div>

    <div class="card">

      <h2>Mis fiestas</h2>

      ${
        state.parties.length

        ?

        state.parties.map(p=>`

          <div
            class="party"
            onclick="party('${p.id}')">

            <div class="party-info">

              <strong>
                ${esc(p.name)}
              </strong>

              <small>

                ${new Date(
                  p.createdAt
                ).toLocaleDateString("es-ES")}

                ·

                ${p.people.length}
                personas

                ${
                  p.finished
                  ?" · Finalizada"
                  :""
                }

              </small>

            </div>

            <span>›</span>

          </div>

        `).join("")

        :

        `<div class="empty">

          Todavía no tienes fiestas.<br>

          Pulsa <b>+</b> para crear la primera.

        </div>`
      }

    </div>

    <div class="firebase-status">

      ${
        firebaseReady
        ? "☁️ Sincronización online activada"
        : "📱 Modo local"
      }

    </div>

  `;

}


/* =========================
   NUEVA FIESTA
========================= */

function newParty(){

  openModal(`

    <div class="modal-head">

      <h2>Nueva fiesta</h2>

      <button
        class="iconbtn"
        type="button"
        onclick="closeModal()">

        ×

      </button>

    </div>

    <input
      id="partyName"
      placeholder="Ej. Navidad"
      autocomplete="off">

    <button
      class="primary"
      type="button"
      onclick="createParty()">

      Crear fiesta

    </button>

  `);

}


/* =========================
   CREAR FIESTA
========================= */

function createParty(){

  const input=
    document.getElementById("partyName");

  const name=
    input
    ? input.value.trim()
    : "";

  const p={

    id:makeId(),

    name:
      name ||
      "Fiesta sin nombre",

    createdAt:Date.now(),

    people:[],

    logs:[],

    finished:false

  };

  state.parties.unshift(p);

  current=p;

  save();

  closeModal();

  render();

}


/* =========================
   PANTALLA DE FIESTA
========================= */

function renderParty(r){

  if(!Array.isArray(current.people)){
    current.people=[];
  }

  if(!Array.isArray(current.logs)){
    current.logs=[];
  }

  r.innerHTML=`

    <div class="header">

      <button
        class="back"
        type="button"
        onclick="goHome()">

        ‹

      </button>

      <div style="text-align:center">

        <h1>
          ${esc(current.name)}
        </h1>

        <div class="sub">

          ${
            current.finished
            ?"Fiesta finalizada"
            :"Fiesta en curso"
          }

        </div>

      </div>

      <button
        class="iconbtn"
        type="button"
        onclick="partyMenu()">

        ⋯

      </button>

    </div>

    <div class="card">

      <div class="section-title">

        <h2>Personas</h2>

        <button
          class="secondary"
          type="button"
          onclick="addPerson()">

          + Añadir

        </button>

      </div>

      <div class="people">

        ${
          current.people.length

          ?

          current.people.map(x=>`

            <div class="person">

              ${esc(x.name)}

              <button
                type="button"
                onclick="
                  removePerson('${x.id}');
                  event.stopPropagation();
                ">

                ×

              </button>

            </div>

          `).join("")

          :

          `<div class="sub">

            Añade a las personas que
            están en la fiesta.

          </div>`
        }

      </div>

    </div>

    ${
      current.finished
      ? resultsHTML()
      : trackerHTML()
    }

    <div class="notice">

      Todo lo que añadas se puede eliminar
      si te equivocas.

    </div>

  `;

}


/* =========================
   REGISTRO
========================= */

function trackerHTML(){

  if(!current.people.length){

    return `

      <div class="card empty">

        Añade al menos una persona
        para empezar a registrar
        copas y chupitos.

      </div>

    `;

  }

  return `

    <div class="card">

      <div class="tabs">

        <button
          class="tab ${tab==="cups"?"active":""}"
          type="button"
          onclick="tab='cups';render()">

          🍹 Copas

        </button>

        <button
          class="tab ${tab==="shots"?"active":""}"
          type="button"
          onclick="tab='shots';render()">

          🥃 Chupitos

        </button>

      </div>

      <div class="section-title">

        <h2>

          ${
            tab==="cups"
            ?"Elige una copa"
            :"Elige un chupito"
          }

        </h2>

        <button
          class="secondary"
          type="button"
          onclick="addOption('${tab}')">

          + Añadir opción

        </button>

      </div>

      <div class="options">

        ${
          state.drinkOptions[tab].map(o=>`

            <button
              class="option"
              type="button"
              onclick="
                chooseDrink(
                  '${encodeURIComponent(o)}'
                )
              ">

              ${esc(o)}

              <small>
                Toca para registrar
              </small>

            </button>

          `).join("")
        }

      </div>

      <div style="margin-top:20px">

        <h2>Contador</h2>

        ${current.people.map(personRow).join("")}

      </div>

      <button
        class="primary"
        type="button"
        onclick="finishParty()">

        🏁 Finalizar fiesta

      </button>

    </div>

  `;

}


/* =========================
   FILA PERSONA
========================= */

function personRow(p){

  const logs=
    current.logs.filter(
      l=>l.personId===p.id
    );

  const cups=
    logs.filter(
      l=>l.kind==="cups"
    ).length;

  const shots=
    logs.filter(
      l=>l.kind==="shots"
    ).length;

  return `

    <div class="person-row">

      <div class="person-head">

        <strong>
          ${esc(p.name)}
        </strong>

        <div class="counts">

          <span class="pill">
            🍹 ${cups}
          </span>

          <span class="pill">
            🥃 ${shots}
          </span>

        </div>

      </div>

      ${
        logs.length

        ?

        `<div class="history">

          ${
            logs
            .slice()
            .reverse()
            .slice(0,6)
            .map(l=>`

              <div class="log">

                <span>

                  ${
                    l.kind==="cups"
                    ?"🍹"
                    :"🥃"
                  }

                  ${esc(l.drink)}

                  ·

                  ${new Date(
                    l.time
                  ).toLocaleTimeString(
                    "es-ES",
                    {
                      hour:"2-digit",
                      minute:"2-digit"
                    }
                  )}

                </span>

                <button
                  type="button"
                  onclick="removeLog('${l.id}')">

                  Quitar

                </button>

              </div>

            `).join("")
          }

        </div>`

        :

        ""
      }

    </div>

  `;

}


/* =========================
   ELEGIR COPA / CHUPITO
========================= */

function chooseDrink(enc){

  const drink=
    decodeURIComponent(enc);

  openModal(`

    <div class="modal-head">

      <h2>

        ${
          tab==="cups"
          ?"🍹 Copa"
          :"🥃 Chupito"
        }

      </h2>

      <button
        class="iconbtn"
        type="button"
        onclick="closeModal()">

        ×

      </button>

    </div>

    <p>

      <b>${esc(drink)}</b><br>

      <span class="sub">
        ¿Quién lo ha tomado?
      </span>

    </p>

    ${
      current.people.map(p=>`

        <button
          class="option"
          type="button"
          style="width:100%;margin:5px 0"
          onclick="
            addLog(
              '${p.id}',
              '${encodeURIComponent(drink)}'
            )
          ">

          ${esc(p.name)}

        </button>

      `).join("")
    }

  `);

}


/* =========================
   AÑADIR REGISTRO
========================= */

function addLog(personId,enc){

  current.logs.push({

    id:makeId(),

    personId:personId,

    kind:tab,

    drink:decodeURIComponent(enc),

    time:Date.now()

  });

  save();

  closeModal();

  render();

}


/* =========================
   QUITAR REGISTRO
========================= */

function removeLog(id){

  current.logs=
    current.logs.filter(
      l=>l.id!==id
    );

  save();

  render();

}


/* =========================
   AÑADIR PERSONA
========================= */

function addPerson(){

  openModal(`

    <div class="modal-head">

      <h2>Añadir persona</h2>

      <button
        class="iconbtn"
        type="button"
        onclick="closeModal()">

        ×

      </button>

    </div>

    <input
      id="personName"
      placeholder="Nombre"
      autocomplete="off">

    <button
      class="primary"
      type="button"
      onclick="createPerson()">

      Añadir

    </button>

  `);

}


/* =========================
   CREAR PERSONA
========================= */

function createPerson(){

  const input=
    document.getElementById("personName");

  const name=
    input
    ? input.value.trim()
    : "";

  if(!name){
    return;
  }

  current.people.push({

    id:makeId(),

    name:name

  });

  save();

  closeModal();

  render();

}


/* =========================
   QUITAR PERSONA
========================= */

function removePerson(id){

  const p=
    current.people.find(
      x=>x.id===id
    );

  if(!p){
    return;
  }

  openModal(`

    <div class="modal-head">

      <h2>Quitar persona</h2>

      <button
        class="iconbtn"
        type="button"
        onclick="closeModal()">

        ×

      </button>

    </div>

    <p>

      ¿Quitar a
      <b>${esc(p.name)}</b>?

      Sus registros también se eliminarán.

    </p>

    <button
      class="danger"
      type="button"
      style="width:100%"
      onclick="confirmRemovePerson('${id}')">

      Sí, quitar

    </button>

  `);

}


function confirmRemovePerson(id){

  current.people=
    current.people.filter(
      p=>p.id!==id
    );

  current.logs=
    current.logs.filter(
      l=>l.personId!==id
    );

  save();

  closeModal();

  render();

}


/* =========================
   AÑADIR OPCIÓN
========================= */

function addOption(kind){

  openModal(`

    <div class="modal-head">

      <h2>

        Añadir
        ${
          kind==="cups"
          ?"copa"
          :"chupito"
        }

      </h2>

      <button
        class="iconbtn"
        type="button"
        onclick="closeModal()">

        ×

      </button>

    </div>

    <input
      id="optionName"
      placeholder="Ej. Whisky cola"
      autocomplete="off">

    <button
      class="primary"
      type="button"
      onclick="createOption('${kind}')">

      Añadir opción

    </button>

  `);

}


/* =========================
   CREAR OPCIÓN
========================= */

function createOption(kind){

  const input=
    document.getElementById("optionName");

  const n=
    input
    ? input.value.trim()
    : "";

  if(!n){
    return;
  }

  if(
    !state.drinkOptions[kind].includes(n)
  ){

    state.drinkOptions[kind].push(n);

  }

  save();

  closeModal();

  render();

}


/* =========================
   FINALIZAR FIESTA
========================= */

function finishParty(){

  openModal(`

    <div class="modal-head">

      <h2>¿Finalizar fiesta?</h2>

      <button
        class="iconbtn"
        type="button"
        onclick="closeModal()">

        ×

      </button>

    </div>

    <p>

      Podrás consultar las gráficas
      y la clasificación.

      Los registros quedarán guardados.

    </p>

    <button
      class="primary"
      type="button"
      onclick="confirmFinishParty()">

      🏁 Sí, finalizar

    </button>

  `);

}


function confirmFinishParty(){

  current.finished=true;

  save();

  closeModal();

  render();

}


/* =========================
   RESULTADOS
========================= */

function resultsHTML(){

  const totals=
    current.people.map(p=>({

      p:p,

      c:
        current.logs.filter(
          l=>
            l.personId===p.id &&
            l.kind==="cups"
        ).length,

      s:
        current.logs.filter(
          l=>
            l.personId===p.id &&
            l.kind==="shots"
        ).length

    }));

  const max=
    Math.max(
      1,
      ...totals.map(
        x=>x.c+x.s
      )
    );

  const sorted=
    [...totals].sort(
      (a,b)=>
        (b.c+b.s) -
        (a.c+a.s)
    );

  return `

    <div class="card">

      <h2>📊 Resultados</h2>

      <p class="sub">

        Copas + chupitos registrados
        durante la fiesta.

      </p>

      ${
        totals.map(x=>`

          <div class="chartbar">

            <div class="chartlabel">

              <span>
                ${esc(x.p.name)}
              </span>

              <span>
                ${x.c+x.s} total
              </span>

            </div>

            <div class="barbg">

              <div
                class="bar"
                style="
                  width:${(x.c+x.s)/max*100}%;
                ">
              </div>

            </div>

            <div class="sub">

              🍹 ${x.c} copas
              ·
              🥃 ${x.s} chupitos

            </div>

          </div>

        `).join("")
      }

    </div>

    <div class="card">

      <h2>🏆 Clasificación</h2>

      ${
        sorted.map((x,i)=>`

          <div class="rank">

            <div class="ranknum">
              ${i+1}.
            </div>

            <strong>
              ${esc(x.p.name)}
            </strong>

            <div class="total">
              ${x.c+x.s}
            </div>

          </div>

        `).join("")
      }

    </div>

    <div class="card">

      <h2>🕒 Registro</h2>

      ${
        current.logs.length

        ?

        current.logs
        .slice()
        .sort(
          (a,b)=>b.time-a.time
        )
        .map(l=>{

          const p=
            current.people.find(
              x=>x.id===l.personId
            );

          return `

            <div class="log">

              <span>

                ${esc(
                  p?.name || ""
                )}

                ·

                ${
                  l.kind==="cups"
                  ?"🍹"
                  :"🥃"
                }

                ${esc(l.drink)}

              </span>

              <span>

                ${new Date(
                  l.time
                ).toLocaleTimeString(
                  "es-ES",
                  {
                    hour:"2-digit",
                    minute:"2-digit"
                  }
                )}

              </span>

            </div>

          `;

        }).join("")

        :

        `<div class="empty">

          No hay registros.

        </div>`
      }

    </div>

  `;

}


/* =========================
   MENÚ DE FIESTA
========================= */

function partyMenu(){

  openModal(`

    <div class="modal-head">

      <h2>Opciones</h2>

      <button
        class="iconbtn"
        type="button"
        onclick="closeModal()">

        ×

      </button>

    </div>

    <button
      class="secondary"
      type="button"
      style="width:100%;margin:5px 0"
      onclick="resumeParty()">

      ↩️ Volver a editar fiesta

    </button>

    <button
      class="danger"
      type="button"
      style="width:100%;margin:5px 0"
      onclick="deleteParty()">

      🗑️ Eliminar fiesta

    </button>

  `);

}


function resumeParty(){

  current.finished=false;

  save();

  closeModal();

  render();

}


/* =========================
   ELIMINAR FIESTA
========================= */

function deleteParty(){

  openModal(`

    <div class="modal-head">

      <h2>Eliminar fiesta</h2>

      <button
        class="iconbtn"
        type="button"
        onclick="closeModal()">

        ×

      </button>

    </div>

    <p>

      Esta acción eliminará toda
      la fiesta y sus registros.

    </p>

    <button
      class="danger"
      type="button"
      style="width:100%"
      onclick="confirmDeleteParty()">

      Eliminar definitivamente

    </button>

  `);

}


function confirmDeleteParty(){

  if(!current){
    return;
  }

  state.parties=
    state.parties.filter(
      p=>p.id!==current.id
    );

  current=null;

  save();

  closeModal();

  render();

}


/* =========================
   MODALES
========================= */

function openModal(html){

  const modal=
    document.getElementById("modal");

  const modalBg=
    document.getElementById("modalBg");

  modal.innerHTML=html;

  modalBg.classList.add("show");

  setTimeout(()=>{

    const input=
      modal.querySelector("input");

    if(input){
      input.focus();
    }

  },50);

}


function closeModal(){

  document
    .getElementById("modalBg")
    .classList.remove("show");

}


/* =========================
   CERRAR MODAL TOCANDO FUERA
========================= */

document
  .getElementById("modalBg")
  .addEventListener(
    "click",
    e=>{

      if(e.target.id==="modalBg"){
        closeModal();
      }

    }
  );


/* =========================
   ARRANQUE
========================= */

render();

startFirebase();

</script>

</body>
</html>
